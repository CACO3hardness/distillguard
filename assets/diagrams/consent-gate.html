<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DistillGuard 的五项同意核对</title>
  <style>
    body { margin: 0; background: #fff; }
    svg { display: block; width: 1280px; height: 620px; }
  </style>
</head>
<body>
<svg id="consent-gate-root" xmlns="http://www.w3.org/2000/svg"
     width="1280" height="620" viewBox="0 0 1280 620"
     role="img" aria-labelledby="consent-gate-title consent-gate-desc"
     font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif">
  <title id="consent-gate-title">DistillGuard 的五项同意核对</title>
  <desc id="consent-gate-desc">单独签署、明确范围期限、避开离职压力、对价单列和可撤回五项同时成立才放行，任一缺失即挂起或拦截。</desc>
  <defs>
    <marker id="consent-gate-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#17365D"/>
    </marker>
    <marker id="consent-gate-arrow-green" markerWidth="6" markerHeight="6" refX="5" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#4F8A5B"/>
    </marker>
    <marker id="consent-gate-arrow-red" markerWidth="6" markerHeight="6" refX="5" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#C0504D"/>
    </marker>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="152" y1="230" x2="152" y2="300" stroke="#17365D" stroke-width="3"/>
    <line x1="396" y1="230" x2="396" y2="300" stroke="#17365D" stroke-width="3"/>
    <line x1="640" y1="230" x2="640" y2="300" stroke="#17365D" stroke-width="3"/>
    <line x1="884" y1="230" x2="884" y2="300" stroke="#17365D" stroke-width="3"/>
    <line x1="1128" y1="230" x2="1128" y2="300" stroke="#17365D" stroke-width="3"/>
    <line x1="152" y1="300" x2="1128" y2="300" stroke="#17365D" stroke-width="3"/>
    <line x1="640" y1="300" x2="640" y2="360" stroke="#17365D" stroke-width="4"
          marker-end="url(#consent-gate-arrow)"/>
    <path d="M 560 470 V 492 H 360 V 520"
          stroke="#C0504D" stroke-width="4" marker-end="url(#consent-gate-arrow-red)"/>
    <path d="M 720 470 V 492 H 920 V 520"
          stroke="#4F8A5B" stroke-width="4" marker-end="url(#consent-gate-arrow-green)"/>
  </g>

  <!-- 五项条件 -->
  <rect x="48" y="88" width="208" height="142" rx="8" fill="#F7F9FC" stroke="#AAB7C4" stroke-width="2"/>
  <text x="72" y="122" font-size="15" font-weight="700" fill="#2E75B6">01</text>
  <text x="152" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#17365D">单独签署</text>
  <text x="152" y="192" text-anchor="middle" font-size="16" fill="#5E6B78">不并入其他条款</text>

  <rect x="292" y="88" width="208" height="142" rx="8" fill="#F7F9FC" stroke="#AAB7C4" stroke-width="2"/>
  <text x="316" y="122" font-size="15" font-weight="700" fill="#2E75B6">02</text>
  <text x="396" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#17365D">范围与期限</text>
  <text x="396" y="192" text-anchor="middle" font-size="16" fill="#5E6B78">用途 · 场景 · 到期</text>

  <rect x="536" y="88" width="208" height="142" rx="8" fill="#F7F9FC" stroke="#AAB7C4" stroke-width="2"/>
  <text x="560" y="122" font-size="15" font-weight="700" fill="#2E75B6">03</text>
  <text x="640" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#17365D">避开压力时点</text>
  <text x="640" y="192" text-anchor="middle" font-size="16" fill="#5E6B78">不卡在离职谈判期</text>

  <rect x="780" y="88" width="208" height="142" rx="8" fill="#F7F9FC" stroke="#AAB7C4" stroke-width="2"/>
  <text x="804" y="122" font-size="15" font-weight="700" fill="#2E75B6">04</text>
  <text x="884" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#17365D">对价单列</text>
  <text x="884" y="192" text-anchor="middle" font-size="16" fill="#5E6B78">不与工资奖金混同</text>

  <rect x="1024" y="88" width="208" height="142" rx="8" fill="#F7F9FC" stroke="#AAB7C4" stroke-width="2"/>
  <text x="1048" y="122" font-size="15" font-weight="700" fill="#2E75B6">05</text>
  <text x="1128" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#17365D">可撤回</text>
  <text x="1128" y="192" text-anchor="middle" font-size="16" fill="#5E6B78">有可查验退出通道</text>

  <!-- 闸门 -->
  <rect x="490" y="360" width="300" height="110" rx="10" fill="#FFF8F0" stroke="#C87835" stroke-width="3"/>
  <text x="640" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#17365D">五项是否同时成立</text>
  <text x="640" y="436" text-anchor="middle" font-size="17" fill="#9A561E">逻辑为 AND，不以平均值放行</text>

  <!-- 结果 -->
  <rect x="150" y="520" width="420" height="62" rx="8" fill="#F8E5E3" stroke="#C0504D" stroke-width="2"/>
  <text x="360" y="548" text-anchor="middle" font-size="19" font-weight="700" fill="#9B3633">任一缺失：pending / blocked</text>
  <text x="360" y="571" text-anchor="middle" font-size="14" fill="#7D4A47">补要件或停止进入下游</text>

  <rect x="710" y="520" width="420" height="62" rx="8" fill="#E7F1EA" stroke="#4F8A5B" stroke-width="2"/>
  <text x="920" y="548" text-anchor="middle" font-size="19" font-weight="700" fill="#35633F">五项齐全：approved</text>
  <text x="920" y="571" text-anchor="middle" font-size="14" fill="#496A50">材料可进入获批目录</text>
</svg>
</body>
</html>
